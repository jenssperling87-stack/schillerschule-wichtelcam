<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Schillerschule · Wichtel-Nachtarchiv</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#060b0b;color:#d9f4e3;font-family:Arial,sans-serif;overflow:hidden}.screen{position:relative;width:100vw;height:100dvh;background:#0b1514}.photo,.video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}.photo{filter:grayscale(1) sepia(.35) hue-rotate(65deg) saturate(.8) brightness(.58) contrast(1.3)}.video{display:none;background:#000;filter:grayscale(1) sepia(.35) hue-rotate(65deg) saturate(.8) brightness(.58) contrast(1.3)}.video.on{display:block}.shade{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 28%,#0009 100%);pointer-events:none}.scan{position:absolute;inset:0;pointer-events:none;opacity:.14;background:repeating-linear-gradient(0deg,transparent 0px,transparent 3px,#000 4px)}.header,.footer{position:absolute;left:2%;right:2%;display:flex;justify-content:space-between;gap:10px;text-shadow:0 2px 5px black;font-weight:bold}.header{top:3%;font-size:clamp(12px,2vw,25px)}.footer{bottom:4%;font-size:clamp(12px,1.7vw,22px)}.tag{background:#03130edb;border:1px solid #8ab39a80;padding:9px 12px;border-radius:4px}.sub{position:absolute;top:12%;left:2%;background:#03130edb;padding:8px 12px;font-size:clamp(11px,1.4vw,17px)}.alert{display:none;position:absolute;top:22%;left:50%;transform:translateX(-50%);color:#ffdddd;background:#550b0be8;border:2px solid #ff7373;padding:14px 20px;font-weight:bold;font-size:clamp(14px,2.3vw,28px);text-align:center;z-index:5}.alert.on{display:block}.fullscreen{position:absolute;bottom:13%;background:#03130edb;color:#d9f4e3;border:1px solid #8ab39a;padding:10px 12px;border-radius:5px;cursor:pointer}.fullscreen{right:2%}.camera-toggle{position:absolute;z-index:12;left:2%;bottom:13%;background:#071b16ee;color:#e2f8e8;border:1px solid #8ab39a;padding:10px 14px;border-radius:5px;font-weight:bold;cursor:pointer}.camera-panel{position:absolute;z-index:11;left:2%;top:20%;bottom:24%;width:min(330px,88vw);overflow:auto;background:#04130ff2;border:1px solid #7fa88b;border-radius:8px;padding:12px;box-shadow:0 8px 30px #000b;display:none}.camera-panel.open{display:block}.camera-panel h2{font-size:17px;margin:0 0 10px}.camera-list{display:grid;gap:5px}.camera-choice{background:#112820;color:#e2f8e8;border:1px solid #36594a;border-radius:5px;padding:10px;text-align:left;cursor:pointer;font-size:14px}.camera-choice.active{background:#27523c;border-color:#b2e5bd}.camera-status{font-size:12px;color:#b5cbbf;margin-top:10px;line-height:1.4}.hint{position:absolute;bottom:21%;left:2%;font-size:13px;background:#03130edb;padding:7px 10px;max-width:80%}@media(max-width:600px){.header,.footer{left:3%;right:3%}.tag{padding:7px}.camera-panel{top:18%;bottom:23%}.hint{bottom:23%;font-size:11px}}
</style></head><body><main class="screen"><img class="photo" id="photo" alt="Simulierte Nachtsichtaufnahme"><video class="video" id="ballvideo" muted playsinline preload="auto" aria-label="KI-Video Wichtel im Ballraum"><source src="assets/wichtel_ballraum.mp4" type="video/mp4"></video><div class="shade"></div><div class="scan"></div><div class="header"><span class="tag">SCHILLERSCHULE · NACHTARCHIV</span><span class="tag">◉ AUFZEICHNUNG</span></div><div class="sub">SIMULIERTE NACHTAUFNAHME · KEINE LIVEKAMERA · VERSION KI-4 · AUTOMATIK</div><div class="alert" id="alert">⚠ BEWEGUNG ERKANNT</div><div class="footer"><span class="tag" id="camera"></span><span class="tag" id="stamp"></span></div><button class="camera-toggle" id="cameraToggle" type="button" aria-expanded="false" aria-controls="cameraPanel">☷ Kameras (11)</button><aside class="camera-panel" id="cameraPanel"><h2>Kamera auswählen</h2><div class="camera-list" id="cameraList"></div><div class="camera-status" id="cameraStatus">Automatische Kameraüberwachung</div></aside><span class="hint" id="hint">Automatischer Rückblick · Nachtmodus</span><button class="fullscreen" type="button" id="fullscreen">⛶ Vollbild</button></main>
<script>
'use strict';
const cameras=[['01 · GEHEIMER WICHTELRAUM','geheimraum.jpg'],['02 · SCHULFLUR','raum1.jpg'],['03 · 4b PINGUINKLASSE','raum2.jpg'],['04 · 4a WASCHBÄRKLASSE','raum3.jpg'],['05 · BALLRAUM','ballraum.jpg'],['06 · GERÄTERAUM','geraeteraum.jpg'],['07 · 1a EULENKLASSE','eulenklasse.jpg'],['08 · SCHULHOF','schulhof.jpg'],['09 · SPORTFACHSCHAFT','sportfachschaft.jpg'],['10 · SEKRETARIAT','sekretariat.jpg'],['11 · LEHRERZIMMER','lehrerzimmer.jpg']];
const el=id=>document.getElementById(id),video=el('ballvideo');
let idx=1,token=0,timer=null,alertTimer=null,manualUntil=0,sequenceActive=false;
const day=new Date();day.setDate(day.getDate()-1);day.setHours(1,13,0,0);
const recordingStart=day.getTime(),realStart=Date.now();
function schedule(fn,ms){clearTimeout(timer);timer=setTimeout(fn,ms)}
function hideVideo(){video.pause();video.classList.remove('on');try{video.currentTime=0}catch(e){}}
function showCamera(i){idx=i;hideVideo();el('alert').classList.remove('on');el('photo').src='assets/'+cameras[i][1];el('camera').textContent='CAM '+cameras[i][0];el('hint').textContent='Automatischer Rückblick · Nachtmodus';document.querySelectorAll('.camera-choice').forEach((b,j)=>{b.classList.toggle('active',j===i);b.setAttribute('aria-current',j===i?'true':'false')})}
function startLoop(){sequenceActive=true;showCamera(1);el('cameraStatus').textContent='Automatische Kameraüberwachung';schedule(motionDetected,10000)}
function motionDetected(){if(Date.now()<manualUntil){sequenceActive=false;return}el('alert').textContent='⚠ BEWEGUNG ERKANNT · BALLRAUM';el('alert').classList.add('on');el('hint').textContent='Bewegungsmelder · Kamera 05';schedule(switchToBallroom,2300)}
async function switchToBallroom(){showCamera(4);el('alert').textContent='⚠ BEWEGUNG ERKANNT · BALLRAUM';el('alert').classList.add('on');el('hint').textContent='Bewegung erkannt · Kamera 05';const myToken=++token;try{video.currentTime=0;video.classList.add('on');await video.play();if(myToken!==token)return;alertTimer=setTimeout(()=>el('alert').classList.remove('on'),1800)}catch(e){video.classList.remove('on');el('alert').classList.remove('on');el('hint').textContent='Video nicht verfügbar: assets/wichtel_ballraum.mp4';schedule(()=>continueCycle(5),4500)}}
function continueCycle(next){if(!sequenceActive)return;showCamera(next);schedule(()=>{if(next===10){startLoop()}else{continueCycle(next+1)}},10000)}
video.addEventListener('ended',()=>{video.classList.remove('on');el('alert').classList.remove('on');el('hint').textContent='Ballraum · Keine weitere Bewegung';schedule(()=>continueCycle(5),3500)});
video.addEventListener('error',()=>{video.classList.remove('on');el('alert').classList.remove('on');el('hint').textContent='Video fehlt: assets/wichtel_ballraum.mp4';schedule(()=>continueCycle(5),4500)});
function stamp(){const t=new Date(recordingStart+(Date.now()-realStart));el('stamp').textContent=t.toLocaleDateString('de-DE')+' · '+t.toLocaleTimeString('de-DE',{hour12:false})}
const list=el('cameraList');cameras.forEach((c,i)=>{const b=document.createElement('button');b.type='button';b.className='camera-choice';b.textContent='CAM '+c[0];b.addEventListener('click',()=>{token++;sequenceActive=false;clearTimeout(timer);clearTimeout(alertTimer);manualUntil=Date.now()+30000;showCamera(i);el('cameraStatus').textContent='Manuelle Ansicht · Automatik in 30 Sekunden';schedule(()=>{manualUntil=0;startLoop()},30000);el('cameraPanel').classList.remove('open');el('cameraToggle').setAttribute('aria-expanded','false')});list.appendChild(b)});
el('cameraToggle').addEventListener('click',()=>{const open=el('cameraPanel').classList.toggle('open');el('cameraToggle').setAttribute('aria-expanded',String(open))});
el('fullscreen').addEventListener('click',()=>document.documentElement.requestFullscreen?.());
el('photo').onerror=()=>{el('hint').textContent='Foto fehlt: assets/'+cameras[idx][1]};
startLoop();stamp();setInterval(stamp,1000);
</script></body></html>
