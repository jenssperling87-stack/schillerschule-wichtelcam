<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Schillerschule · Wichtel-Nachtarchiv</title><style>
*{box-sizing:border-box}body{margin:0;background:#060b0b;color:#d9f4e3;font-family:Arial,sans-serif;overflow:hidden}.screen{position:relative;width:100vw;height:100dvh;background:#0b1514}.photo{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;filter:grayscale(1) sepia(.35) hue-rotate(65deg) saturate(.8) brightness(.58) contrast(1.3)}.shade{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 28%,#0009 100%);pointer-events:none}.scan{position:absolute;inset:0;pointer-events:none;opacity:.14;background:repeating-linear-gradient(0deg,transparent 0px,transparent 3px,#000 4px)}.header,.footer{position:absolute;left:2%;right:2%;display:flex;justify-content:space-between;gap:10px;text-shadow:0 2px 5px black;font-weight:bold}.header{top:3%;font-size:clamp(12px,2vw,25px)}.footer{bottom:4%;font-size:clamp(12px,1.7vw,22px)}.tag{background:#03130edb;border:1px solid #8ab39a80;padding:9px 12px;border-radius:4px}.sub{position:absolute;top:12%;left:2%;background:#03130edb;padding:8px 12px;font-size:clamp(11px,1.4vw,17px)}.alert{display:none;position:absolute;top:22%;left:50%;transform:translateX(-50%);color:#ffdddd;background:#550b0be8;border:2px solid #ff7373;padding:14px 20px;font-weight:bold;font-size:clamp(14px,2.3vw,28px);text-align:center;z-index:5}.alert.on{display:block}.elf{display:none;position:absolute;left:-15%;bottom:14%;width:auto;height:clamp(65px,13vh,155px);object-fit:contain;filter:grayscale(1) sepia(.35) hue-rotate(65deg) brightness(.62) contrast(1.35) drop-shadow(0 4px 4px #000b);z-index:3;pointer-events:none}.elf.on{display:block;animation:sneak 15s linear forwards}@keyframes sneak{0%{left:-12%;opacity:0;transform:scale(.75)}8%{opacity:1}30%{left:24%;transform:scale(.85)}48%{left:39%;transform:scale(.9)}65%{left:40%;transform:scale(.9)}86%{opacity:1;left:73%;transform:scale(.82)}100%{left:108%;opacity:0;transform:scale(.75)}}.hint{position:absolute;bottom:13%;left:2%;font-size:12px;background:#03130edb;padding:7px 10px;opacity:.75}.fullscreen{position:absolute;right:2%;bottom:13%;background:#03130edb;color:#d9f4e3;border:1px solid #8ab39a;padding:8px 12px;border-radius:5px;cursor:pointer}@media(max-width:600px){.header,.footer{left:3%;right:3%}.tag{padding:7px}.hint{max-width:65%}}

.camera-toggle{position:absolute;z-index:12;left:2%;bottom:13%;background:#071b16ee;color:#e2f8e8;border:1px solid #8ab39a;padding:10px 14px;border-radius:5px;font-weight:bold;cursor:pointer}
.camera-panel{position:absolute;z-index:11;left:2%;top:20%;bottom:24%;width:min(330px,88vw);overflow:auto;background:#04130ff2;border:1px solid #7fa88b;border-radius:8px;padding:12px;box-shadow:0 8px 30px #000b;display:none}
.camera-panel.open{display:block}.camera-panel h2{font-size:17px;margin:0 0 10px}.camera-list{display:grid;gap:5px}.camera-choice{background:#112820;color:#e2f8e8;border:1px solid #36594a;border-radius:5px;padding:10px;text-align:left;cursor:pointer;font-size:14px}.camera-choice.active{background:#27523c;border-color:#b2e5bd}.camera-choice:focus-visible,.camera-toggle:focus-visible{outline:3px solid #fff}.camera-status{font-size:12px;color:#b5cbbf;margin-top:10px;line-height:1.4}
@media(max-width:600px){.camera-panel{top:18%;bottom:23%}.camera-toggle{bottom:13%}.hint{display:none}}
</style></head><body><main class="screen"><img class="photo" id="photo" alt="Simulierte Nachtsichtaufnahme"><div class="shade"></div><div class="scan"></div><div class="header"><span class="tag">SCHILLERSCHULE · NACHTARCHIV</span><span class="tag">◉ AUFZEICHNUNG</span></div><div class="sub">SIMULIERTE NACHTAUFNAHME · KEINE LIVEKAMERA</div><div class="alert" id="alert">⚠ BEWEGUNG ERKANNT</div><img class="elf" id="elf" src="assets/wichtel_laterne.gif" alt="Animierter Weihnachtswichtel"><div class="footer"><span class="tag" id="camera"></span><span class="tag" id="stamp"></span></div><button class="camera-toggle" id="cameraToggle" type="button" aria-expanded="false" aria-controls="cameraPanel">☷ Kameras (11)</button><aside class="camera-panel" id="cameraPanel" aria-label="Kameraauswahl"><h2>Kamera auswählen</h2><div class="camera-list" id="cameraList"></div><div class="camera-status" id="cameraStatus">Automatischer Wechsel alle 24 Sekunden</div></aside><span class="hint" id="hint">Automatischer Rückblick · Nachtmodus</span><button class="fullscreen" onclick="document.documentElement.requestFullscreen?.()">⛶ Vollbild</button></main><script>
const cameras=[['01 · GEHEIMER WICHTELRAUM','geheimraum.jpg'],['02 · SCHULFLUR','raum1.jpg'],['03 · 4b PINGUINKLASSE','raum2.jpg'],['04 · 4a WASCHBÄRKLASSE','raum3.jpg'],['05 · BALLRAUM','ballraum.jpg'],['06 · GERÄTERAUM','geraeteraum.jpg'],['07 · 1a EULENKLASSE','eulenklasse.jpg'],['08 · SCHULHOF','schulhof.jpg'],['09 · SPORTFACHSCHAFT','sportfachschaft.jpg'],['10 · SEKRETARIAT','sekretariat.jpg'],['11 · LEHRERZIMMER','lehrerzimmer.jpg']];
const el=id=>document.getElementById(id);let idx=0,started=Date.now(),lastEvent=-1,holdUntil=0,sceneTimer=null,alertTimer=null;const day=new Date();day.setDate(day.getDate()-1);const date=day.toLocaleDateString('de-DE');function show(){clearTimeout(sceneTimer);clearTimeout(alertTimer);let c=cameras[idx];el('photo').src='assets/'+c[1];el('camera').textContent='CAM '+c[0];el('alert').classList.remove('on');el('elf').classList.remove('on');void el('elf').offsetWidth;let daySeed=day.getDate()+day.getMonth()*31;let event=(idx===1)||((idx*7+daySeed)%5===0);if(event){sceneTimer=setTimeout(()=>{if(idx===current){el('alert').classList.add('on');el('elf').src='assets/wichtel_laterne.gif?run='+Date.now();el('elf').classList.add('on');alertTimer=setTimeout(()=>el('alert').classList.remove('on'),6000)}},5500)}const current=idx;updateChoices();}
function stamp(){const seconds=Math.floor((Date.now()-started)/1000);let s=(1*3600+13*60+seconds*9)%(4*3600);let h=1+Math.floor(s/3600),m=Math.floor(s%3600/60),sec=s%60;el('stamp').textContent=date+' · '+[h,m,sec].map(x=>String(x).padStart(2,'0')).join(':')}
function updateChoices(){document.querySelectorAll('.camera-choice').forEach((b,i)=>{b.classList.toggle('active',i===idx);b.setAttribute('aria-current',i===idx?'true':'false')});}
const list=el('cameraList');cameras.forEach((c,i)=>{const b=document.createElement('button');b.type='button';b.className='camera-choice';b.textContent='CAM '+c[0];b.addEventListener('click',()=>{idx=i;holdUntil=Date.now()+60000;show();el('cameraStatus').textContent='Manuelle Auswahl · Automatik startet in 60 Sekunden';el('cameraPanel').classList.remove('open');el('cameraToggle').setAttribute('aria-expanded','false')});list.appendChild(b)});
el('cameraToggle').addEventListener('click',()=>{const open=el('cameraPanel').classList.toggle('open');el('cameraToggle').setAttribute('aria-expanded',String(open))});
el('photo').onerror=()=>{el('hint').textContent='Bild fehlt: Bitte assets-Dateien vollständig hochladen'};show();stamp();setInterval(stamp,1000);setInterval(()=>{if(Date.now()<holdUntil)return;idx=(idx+1)%cameras.length;show();el('cameraStatus').textContent='Automatischer Wechsel alle 24 Sekunden'},24000);
</script></body></html>
