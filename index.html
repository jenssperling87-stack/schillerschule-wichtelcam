<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Schillerschule · Wichtel-Nachtarchiv</title><style>
*{box-sizing:border-box}body{margin:0;background:#060b0b;color:#d9f4e3;font-family:Arial,sans-serif;overflow:hidden}.screen{position:relative;width:100vw;height:100dvh;background:#0b1514}.photo{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;filter:grayscale(1) sepia(.35) hue-rotate(65deg) saturate(.8) brightness(.58) contrast(1.3)}.shade{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 28%,#0009 100%);pointer-events:none}.scan{position:absolute;inset:0;pointer-events:none;opacity:.14;background:repeating-linear-gradient(0deg,transparent 0px,transparent 3px,#000 4px)}.header,.footer{position:absolute;left:2%;right:2%;display:flex;justify-content:space-between;gap:10px;text-shadow:0 2px 5px black;font-weight:bold}.header{top:3%;font-size:clamp(12px,2vw,25px)}.footer{bottom:4%;font-size:clamp(12px,1.7vw,22px)}.tag{background:#03130edb;border:1px solid #8ab39a80;padding:9px 12px;border-radius:4px}.sub{position:absolute;top:12%;left:2%;background:#03130edb;padding:8px 12px;font-size:clamp(11px,1.4vw,17px)}.alert{display:none;position:absolute;top:22%;left:50%;transform:translateX(-50%);color:#ffdddd;background:#550b0be8;border:2px solid #ff7373;padding:14px 20px;font-weight:bold;font-size:clamp(14px,2.3vw,28px);text-align:center;z-index:5}.alert.on{display:block}.elf{display:none;position:absolute;left:-15%;bottom:15%;font-size:clamp(55px,11vw,160px);filter:grayscale(1) sepia(.5) hue-rotate(70deg) brightness(.7);z-index:3;text-shadow:0 5px 8px #000}.elf.on{display:block;animation:sneak 13s ease-in-out forwards}@keyframes sneak{0%{left:-15%;transform:scale(.55)}25%{left:28%;transform:scale(.7) rotate(-8deg)}45%{left:45%;transform:scale(.8)}60%{left:45%;transform:scale(.85) rotate(8deg)}100%{left:115%;transform:scale(.6)}}.hint{position:absolute;bottom:13%;left:2%;font-size:12px;background:#03130edb;padding:7px 10px;opacity:.75}.fullscreen{position:absolute;right:2%;bottom:13%;background:#03130edb;color:#d9f4e3;border:1px solid #8ab39a;padding:8px 12px;border-radius:5px;cursor:pointer}@media(max-width:600px){.header,.footer{left:3%;right:3%}.tag{padding:7px}.hint{max-width:65%}}
</style></head><body><main class="screen"><img class="photo" id="photo" alt="Simulierte Nachtsichtaufnahme"><div class="shade"></div><div class="scan"></div><div class="header"><span class="tag">SCHILLERSCHULE · NACHTARCHIV</span><span class="tag">◉ AUFZEICHNUNG</span></div><div class="sub">SIMULIERTE NACHTAUFNAHME · KEINE LIVEKAMERA</div><div class="alert" id="alert">⚠ BEWEGUNG ERKANNT</div><div class="elf" id="elf">🧝</div><div class="footer"><span class="tag" id="camera"></span><span class="tag" id="stamp"></span></div><span class="hint" id="hint">Automatischer Rückblick · Nachtmodus</span><button class="fullscreen" onclick="document.documentElement.requestFullscreen?.()">⛶ Vollbild</button></main><script>
const cameras=[['01 · GEHEIMER WICHTELRAUM','geheimraum.jpg'],['02 · SCHULFLUR','raum1.jpg'],['03 · 4b PINGUINKLASSE','raum2.jpg'],['04 · 4a WASCHBÄRKLASSE','raum3.jpg'],['05 · BALLRAUM','ballraum.jpg'],['06 · GERÄTERAUM','geraeteraum.jpg'],['07 · 1a EULENKLASSE','eulenklasse.jpg'],['08 · SCHULHOF','schulhof.jpg'],['09 · SPORTFACHSCHAFT','sportfachschaft.jpg'],['10 · SEKRETARIAT','sekretariat.jpg'],['11 · LEHRERZIMMER','lehrerzimmer.jpg']];
const el=id=>document.getElementById(id);let idx=0,started=Date.now(),lastEvent=-1;const day=new Date();day.setDate(day.getDate()-1);const date=day.toLocaleDateString('de-DE');function show(){let c=cameras[idx];el('photo').src='assets/'+c[1];el('camera').textContent='CAM '+c[0];el('alert').classList.remove('on');el('elf').classList.remove('on');void el('elf').offsetWidth;let daySeed=day.getDate()+day.getMonth()*31;let event=((idx*7+daySeed)%5===0);if(event){setTimeout(()=>{if(idx===current){el('alert').classList.add('on');el('elf').classList.add('on');setTimeout(()=>el('alert').classList.remove('on'),6000)}},5500)}const current=idx;}
function stamp(){const seconds=Math.floor((Date.now()-started)/1000);let s=(1*3600+13*60+seconds*9)%(4*3600);let h=1+Math.floor(s/3600),m=Math.floor(s%3600/60),sec=s%60;el('stamp').textContent=date+' · '+[h,m,sec].map(x=>String(x).padStart(2,'0')).join(':')}
el('photo').onerror=()=>{el('hint').textContent='Bild fehlt: Bitte assets-Dateien vollständig hochladen'};show();stamp();setInterval(stamp,1000);setInterval(()=>{idx=(idx+1)%cameras.length;show()},24000);
</script></body></html>
