<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Schillerschule – Wichtel-Cam</title><style>*{box-sizing:border-box}body{margin:0;background:#080d10;color:white;font-family:Arial,sans-serif;overflow:hidden}.stage{height:100dvh;width:100vw;position:relative;background:#111}.stage img,.stage video{width:100%;height:100%;object-fit:contain;position:absolute;inset:0}.stage video{display:none}.stage.night img{filter:brightness(.22) saturate(.6) hue-rotate(165deg)}.bar{position:absolute;left:2%;right:2%;display:flex;justify-content:space-between;align-items:center;text-shadow:0 2px 5px black;font-weight:700}.top{top:3%;font-size:clamp(15px,2.3vw,30px)}.bottom{bottom:3%;font-size:clamp(14px,2vw,25px)}.live{color:#ff4747}.label{background:#0009;padding:10px 14px;border-radius:6px}.controls{position:absolute;bottom:11%;left:2%;display:flex;gap:8px;flex-wrap:wrap}.controls button{font-size:14px;background:#15232bd9;border:1px solid #ffffff60;color:#fff;padding:9px;border-radius:5px}.notice{position:absolute;top:14%;left:50%;transform:translateX(-50%);background:#000b;padding:12px 20px;display:none;text-align:center}.notice.on{display:block}.frame{position:absolute;inset:2%;border:2px solid #ffffff50;pointer-events:none}.help{position:absolute;top:22%;left:50%;transform:translateX(-50%);background:#000c;padding:14px;text-align:center;max-width:85%;font-size:14px}@media(max-width:700px){.controls{bottom:16%}}</style></head><body><main class="stage" id="stage"><img id="still" src="assets/geheimraum.jpg" alt="Kamerabild"><video id="clip" muted playsinline preload="none"></video><div class="frame"></div><div class="bar top"><span class="label">SCHILLERSCHULE · WICHTEL-CAM</span><span class="label live" id="status">● LIVE · SIMULATION</span></div><div class="notice" id="notice"></div><div class="bar bottom"><span class="label" id="camera">KAMERA 01 · GEHEIMRAUM</span><span class="label" id="clock"></span></div><div class="controls"><button onclick="choose(0)">Geheimraum</button><button onclick="choose(1)">Flur</button><button onclick="choose(2)">4b Pinguine</button><button onclick="choose(3)">4a Waschbären</button><button onclick="demo()">Nachtaufnahme testen</button><button onclick="document.documentElement.requestFullscreen?.()">Vollbild</button></div><div class="help" id="help">Dies ist die erste funktionsfähige Vorschau mit echten Fotos und Live-Uhr. Animierte Wichtelvideos sind noch nicht hinterlegt.</div></main><script>const cams=[['KAMERA 01 · GEHEIMRAUM','assets/geheimraum.jpg'],['KAMERA 02 · SCHULFLUR','assets/raum1.jpg'],['KAMERA 03 · 4b PINGUINKLASSE','assets/raum2.jpg'],['KAMERA 04 · 4a WASCHBÄRKLASSE','assets/raum3.jpg']];let active=0,night=false;const el=id=>document.getElementById(id);function tick(){el('clock').textContent=new Intl.DateTimeFormat('de-DE',{timeZone:'Europe/Berlin',day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit'}).format(new Date())}setInterval(tick,1000);tick();function choose(i){active=i;night=false;el('stage').classList.remove('night');el('still').src=cams[i][1];el('camera').textContent=cams[i][0];el('notice').classList.remove('on')}function demo(){choose(2);night=true;el('stage').classList.add('night');el('notice').textContent='AUFZEICHNUNG DER LETZTEN NACHT · 02:34 UHR';el('notice').classList.add('on');setTimeout(()=>{if(night)choose(0)},15000)}setTimeout(()=>el('help').style.display='none',12000);</script></body></html>
